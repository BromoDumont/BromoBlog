{{ $bookCover := resources.Get (.Params.bookCover | default "") }}
<div class="bookPreview">
    <a href="{{ .RelPermalink }}">
        <img class="bookCover" src="{{ $bookCover.RelPermalink }}" alt="Capa {{ $.Title }}">
    </a>
    <div class="bookInformations">
        <a href="{{ .RelPermalink }}">
            <h1>{{ .Title }}</h1>
            <p>{{ .Params.preview }}</p>
        </a>
        {{- partial "metadata/bookMetadataPreview.html" . -}}
    </div>
</div>
